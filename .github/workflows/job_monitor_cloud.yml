name: Job Monitor 3D 24-7

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos (los minutos 0 y 30 de cada hora)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser schedule requests

      - name: Ejecutar rastreo de ofertas 3D
        run: |
          python run_cloud_check.py

      - name: Guardar historial de ofertas vistas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add job_history.json
          git diff --staged --quiet || (git commit -m "Actualizar historial de ofertas [skip ci]" && git push)
